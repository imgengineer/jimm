[project]
name = "jimm"
version = "0.1.0"
description = "JAX Image Models - timm-style API on JAX/Flax nnx"
requires-python = ">=3.12"
dependencies = [
  "einops>=0.8.2",
  "jax>=0.11.2",
  "jax[cuda13]>=0.11.2; sys_platform == 'linux'",
  "grain>=0.2.18",
  "flax>=0.12.10",
  "optax>=0.2.8",
  "orbax-checkpoint>=0.12.6",
  "numpy>=2.5.3",
  "opencv-python-headless>=5.0.0.93",
  "tokamax>=0.0.14",
  "triton>=3.8.0; sys_platform == 'linux'",
  "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jimm"]

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-cov>=7.1.0", "pytest-xdist>=3.8.0", "ruff==0.16.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
required-version = "==0.16.10"
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# On top of the default correctness rules (E/F) and import sorting (I), keep the
# syntax modern (UP) and catch likely bugs and needless verbosity (B, SIM, PIE,
# RET, RSE, ISC, FLY, RUF). Reformatting is owned by `ruff format`, which is the
# single source of truth for layout: line length is not re-checked by a lint
# rule, and zip() strictness (B905) is ignored because it would change the
# runtime behaviour of the ported model code.
select = [
  "E4",   # import placement
  "E7",   # statement-level style
  "E9",   # runtime errors
  "F",    # pyflakes
  "I",    # import sorting
  "W",    # whitespace
  "UP",   # modern Python syntax
  "B",    # likely bugs
  "SIM",  # simplifications
  "PIE",  # misc lint
  "RET",  # return statements
  "RSE",  # raise style
  "ISC",  # implicit string concatenation
  "FLY",  # static join
  "RUF",  # ruff-specific
]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"jimm/models/__init__.py" = ["I001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
