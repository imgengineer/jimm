[project]
name = "jimm"
version = "0.1.0"
description = "JAX Image Models - timm-style API on JAX/Flax nnx"
requires-python = ">=3.11"
dependencies = [
  "jax[cuda13]",
  "grain",
  "flax",
  "optax",
  "orbax-checkpoint",
  "numpy",
  "opencv-python-headless>=5.0.0.93",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jimm"]

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-cov>=7.1.0", "pytest-xdist>=3.8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:flax.*"]
