[project]
name = "jimm"
version = "0.1.0"
description = "JAX Image Models - timm-style API on JAX/Flax nnx"
requires-python = ">=3.11"
dependencies = [
  "jax[cuda13]",
  "grain",
  "flax",
  "optax",
  "orbax-checkpoint",
  "pillow",
  "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jimm"]
