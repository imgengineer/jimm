[project]
name = "jimm"
version = "0.1.0"
description = "JAX Image Models - timm-style API on JAX/Flax nnx"
requires-python = ">=3.12"
dependencies = [
  "einops>=0.8.2",
  "jax[cuda13]>=0.11.2",
  "grain>=0.2.18",
  "flax>=0.12.10",
  "optax>=0.2.8",
  "orbax-checkpoint>=0.12.6",
  "numpy>=2.5.3",
  "opencv-python-headless>=5.0.0.93",
]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jimm"]

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-cov>=7.1.0", "pytest-xdist>=3.8.0", "ruff==0.16.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
required-version = "==0.16.10"
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"jimm/models/__init__.py" = ["I001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
