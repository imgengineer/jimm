[project]
name = "jimm"
version = "0.1.0"
description = "JAX Image Models - timm-style API on JAX/Flax nnx"
requires-python = ">=3.12"
dependencies = [
  "einops",
  "jax[cuda13]>=0.11.1",
  "grain",
  "flax>=0.12.9",
  "optax",
  "orbax-checkpoint",
  "numpy",
  "opencv-python-headless>=5.0.0.93",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jimm"]

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-cov>=7.1.0", "pytest-xdist>=3.8.0", "ruff==0.16.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
required-version = "==0.16.4"
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"jimm/models/__init__.py" = ["I001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
